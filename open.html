<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>减肥工作台 - 打开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.icon{width:80px;height:80px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px}
h1{font-size:22px;margin-bottom:8px}
p{font-size:14px;color:#94a3b8;margin-bottom:24px;line-height:1.6}
.url-box{background:#1e293b;border-radius:12px;padding:14px 18px;font-size:13px;color:#818cf8;word-break:break-all;margin-bottom:20px;width:100%;max-width:340px;user-select:all;-webkit-user-select:all}
.btn{display:block;width:100%;max-width:340px;padding:14px;border-radius:12px;font-size:16px;font-weight:600;border:none;cursor:pointer;margin-bottom:12px}
.btn-blue{background:#6366f1;color:#fff}
.btn-green{background:#10b981;color:#fff}
.btn-ghost{background:transparent;color:#94a3b8;border:1px solid #334155}
.steps{margin-top:24px;text-align:left;width:100%;max-width:340px}
.steps h3{font-size:13px;color:#94a3b8;margin-bottom:10px}
.step{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1e293b;font-size:13px}
.step-num{width:24px;height:24px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
</style>
</head>
<body>
<div class="icon">⚖️</div>
<h1>减肥工作台</h1>
<p>105kg → 95kg</p>

<div class="url-box" id="urlBox">weirdo72.github.io/weight-loss-tracker/wl-lite.html</div>

<button class="btn btn-blue" onclick="copyUrl()" id="copyBtn">📋 复制地址</button>
<button class="btn btn-green" onclick="openInSafari()">🌐 用 Safari 打开</button>

<div class="steps">
  <h3>📱 添加到桌面步骤：</h3>
  <div class="step"><span class="step-num">1</span> 点上方「用 Safari 打开」</div>
  <div class="step"><span class="step-num">2</span> 点 Safari 底部 <b>���享按钮</b>（方框↑）</div>
  <div class="step"><span class="step-num">3</span> 点 <b>「添加到主屏幕」</b></div>
</div>

<script>
var url='https://weirdo72.github.io/weight-loss-tracker/wl-lite.html';
function copyUrl(){
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){document.getElementById('copyBtn').textContent='✅ 已复制！去 Safari 粘贴打开'})}
  else{prompt('请手动复制：',url)}
}
function openInSafari(){
  // Try universal link approach
  window.location.href='x-safari-'+url;
  // Fallback: show URL for manual entry
  setTimeout(function(){alert('请手动打开 Safari，粘贴地址：\n\n'+url)},500);
}
</script>
</body>
</html>
